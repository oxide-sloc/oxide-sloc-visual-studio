name: build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  # Cross-platform unit tests for the VS-independent logic (arg building, --plain parsing).
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Test
        run: dotnet test test/OxideSloc.Tests/OxideSloc.Tests.csproj -c Release

  # Build and package the VSIX (Windows-only: needs MSBuild + the VSSDK build tools).
  vsix:
    needs: test
    runs-on: windows-2022
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Build VSIX
        run: msbuild OxideSloc.sln -restore -t:Build -p:Configuration=Release -p:DeployExtension=false

      - name: Upload VSIX artifact
        uses: actions/upload-artifact@v4
        with:
          name: oxide-sloc-vsix
          path: src/OxideSloc/bin/Release/*.vsix
          if-no-files-found: error
